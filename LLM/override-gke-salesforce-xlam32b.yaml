image:
  repository: vllm/vllm-openai
  tag: "v0.8.0"

serviceAccount:
  create: false
  name: ""
  automount: true
  annotations:
    iam.gke.io/gcp-service-account: kubernetes-pods@<PROJECT_ID>.iam.gserviceaccount.com

service:
  type: ClusterIP
  port: 80
  targetPort: 5001

containerPort: 5001

resources:
  limits:
    cpu: "10"
    memory: 30Gi
    nvidia.com/gpu: "2"
  requests:
    cpu: "10"
    memory: 30Gi
    nvidia.com/gpu: "2"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetMemoryUtilizationPercentage: 80

volumes:
  - name: model-cache
    emptyDir: {}
  - name: config-volume
    secret:
      secretName: jinja-config-salesforce-xlam32b
  - name: xlam-tool-code
    secret:
      secretName: xlam-tool-parser-salesforce-xlam32b
  - name: model-volume
    persistentVolumeClaim:
      claimName: toolace-salesforce-xlam32b-pvc

volumeMounts:
  - name: model-cache
    mountPath: /root/.cache/huggingface
  - name: config-volume
    mountPath: /etc/config
    readOnly: true
  - name: xlam-tool-code
    mountPath: /app/tools
    readOnly: true
  - name: model-volume
    mountPath: /mnt/models/xLAM-2-32b-fc-r
    readOnly: true

ingress:
  enabled: true
  className: "nginx"
  hosts:
  - host: api-dev.llm2.example.com
    paths:
      - path: /
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - api-dev.llm2.example.com
    secretName: llm-salesforce-xlam32b-tls

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: 'nginx'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'

nodeSelector:
  cloud.google.com/gke-accelerator: "nvidia-a100-80gb"
  cloud.google.com/gke-accelerator-count: "2"

pv:
  enabled: true
  storage: 100Gi
pvc:
  enabled: true
  storage: 50Gi
nfs:
  server: "10.90.1.66"
  path: "/videoclone/models/xLAM-2-32b-fc-r"

namespace: dev

container:
  secretName: credentials-salesforce-xlam32b
  secretName2: jinja-config-salesforce-xlam32b
  secretName3: xlam-tool-parser-salesforce-xlam32b

  command: ["/bin/sh", "-c"]
  args:
    - "vllm serve /mnt/models/xLAM-2-32b-fc-r \
        --enable-auto-tool-choice \
        --dtype bfloat16  \
        --enforce-eager  \
        --tool-call-parser xlam \
        --tool-parser-plugin /app/tools/xlam_tool_call_parser.py \
        --tensor-parallel-size 2 \
        --gpu-memory-utilization 0.98 \
        --max-num-batched-tokens 8192 \
        --enable-chunked-prefill \
        --port 5001 \
        --max_model_len 16384 \
        --trust-remote-code \
        --quantization=fp8 \
        --chat-template /etc/config/template.jinja"

  env:
    regular:
      - name: PYTHONPATH
        value: /app/tools
      - name: NVIDIA_VISIBLE_DEVICES
        value: "all"
      - name: CUDA_VISIBLE_DEVICES
        value: "0,1"
      - name: GGML_CUDA_FORCE_MMQ
        value: "1"
      - name: GGML_CUDA_FORCE_CUBLAS
        value: "1"
      - name: VLLM_LOGGING_LEVEL
        value: DEBUG
      - name: NCCL_P2P_LEVEL
        value: "NVL"
      - name: VLLM_HOST_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: RAY_NODE_IP_ADDRESS
        valueFrom:
          fieldRef:
            fieldPath: status.podIP

    secret:
      - name: HUGGING_FACE_HUB_TOKEN
        value: ""

jinjaTemplatePath: "files/tool_chat_template_xlam_qwen.jinja"
