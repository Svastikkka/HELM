image:
  repository: vllm/vllm-openai
  tag: "v0.8.5"

serviceAccount:
  create: false
  name: ""
  automount: true
  annotations:
    iam.gke.io/gcp-service-account: kubernetes-pods@<PROJECT_ID>.iam.gserviceaccount.com

service:
  type: ClusterIP
  port: 80
  targetPort: 5001

containerPort: 5001

resources:
  limits:
    cpu: "10"
    memory: 30Gi
    nvidia.com/gpu: "1"
  requests:
    cpu: "10"
    memory: 30Gi
    nvidia.com/gpu: "1"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetMemoryUtilizationPercentage: 80

volumes:
  - name: model-cache
    emptyDir: {}
  - name: config-volume
    secret:
      secretName: jinja-config-qwen
  - name: qwen-tool-code
    secret:
      secretName: qwen-tool-parser-qwen

volumeMounts:
  - name: model-cache
    mountPath: /root/.cache/huggingface
  - name: config-volume
    mountPath: /etc/config
    readOnly: true
  - name: qwen-tool-code
    mountPath: /app/tools
    readOnly: true

ingress:
  enabled: true
  className: "nginx"
  hosts:
  - host: api-dev.llm4.example.com
    paths:
      - path: /
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - api-dev.llm4.example.com
    secretName: llm-qwen-tls

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: 'nginx'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'

nodeSelector:
  cloud.google.com/gke-accelerator: "nvidia-a100-80gb"
  cloud.google.com/gke-accelerator-count: "1"

pv:
  enabled: false
  storage: 100Gi
pvc:
  enabled: false
  storage: 50Gi
nfs:
  server: "10.90.1.66"
  path: "/videoclone/models/ToolACE-8B"

namespace: dev

container:
  secretName: credentials-qwen
  secretName2: jinja-config-qwen
  secretName3: qwen-tool-parser-qwen

  command: ["/bin/sh", "-c"]
  args:
    - "vllm serve Qwen/Qwen3-30B-A3B \
      --trust-remote-code \
      --enable-chunked-prefill \
      --enable-auto-tool-choice \
      --tool-call-parser=hermes \
      --port 5001 \
      --dtype bfloat16 \
      --chat-template /etc/config/template.jinja"

  env:
    regular:
      - name: PYTHONPATH
        value: /app/tools
      - name: NVIDIA_VISIBLE_DEVICES
        value: "all"
      - name: CUDA_VISIBLE_DEVICES
        value: "0"
      - name: GGML_CUDA_FORCE_MMQ
        value: "1"
      - name: GGML_CUDA_FORCE_CUBLAS
        value: "1"
      - name: VLLM_LOGGING_LEVEL
        value: DEBUG
      - name: NCCL_P2P_LEVEL
        value: "NVL"
      - name: VLLM_HOST_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: RAY_NODE_IP_ADDRESS
        valueFrom:
          fieldRef:
            fieldPath: status.podIP

    secret:
      - name: HUGGING_FACE_HUB_TOKEN
        value: ""

jinjaTemplatePath: "files/template-qwen.jinja"
