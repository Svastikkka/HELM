image:
  repository: vllm/vllm-openai
  tag: "latest"

serviceAccount:
  create: false
  name: ""
  automount: true
  annotations:
    iam.gke.io/gcp-service-account: kubernetes-pods@nonprod1-svc-r4rc.iam.gserviceaccount.com

service:
  type: ClusterIP
  port: 80
  targetPort: 5001

containerPort: 5001

resources:
  limits:
    cpu: "10"
    memory: 64Gi
    nvidia.com/gpu: "1"
  requests:
    cpu: "10"
    memory: 64Gi
    nvidia.com/gpu: "1"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetMemoryUtilizationPercentage: 80

volumes:
  - name: model-cache
    emptyDir: {}
  - name: toolace-nfs
    persistentVolumeClaim:
      claimName: toolace-pvc
  - name: config-volume
    secret:
      secretName: jinja-config

volumeMounts:
  - name: model-cache
    mountPath: /root/.cache/huggingface
  - name: toolace-nfs
    mountPath: /mnt/models
  - name: config-volume
    mountPath: /etc/config
    readOnly: true

ingress:
  enabled: true
  className: "nginx"
  hosts:
  - host: api-dev.llm.example.com
    paths:
      - path: /
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - api-dev.llm.example.com
    secretName: llm-tls

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: 'nginx'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'

nodeSelector:
  cloud.google.com/gke-accelerator: nvidia-tesla-a100
  cloud.google.com/gke-accelerator-count: "2"

pv:
  storage: 100Gi
pvc:
  storage: 50Gi
nfs:
  server: "10.90.1.66"
  path: "/videoclone/models/ToolACE-8B"

namespace: dev

container:
  secretName: credentials

  command: ["/bin/sh", "-c"]
  args:
    - "vllm serve watt-ai/watt-tool-8B \
      --trust-remote-code \
      --enable-chunked-prefill \
      --max_num_batched_tokens 1024 \
      --enable-auto-tool-choice \
      --tool-call-parser pythonic \
      --gpu_memory_utilization=0.9 \
      --max_model_len 82000 \
      --port 5001 \
      --quantization=fp8 \
      --max-parallel-loading-workers=4 \
      --enable-auto-tool-choice \
      --chat-template /etc/config/template.jinja"

  env:
    regular:
      - name: NVIDIA_VISIBLE_DEVICES
        value: "all"
      - name: CUDA_VISIBLE_DEVICES
        value: "0"
      - name: GGML_CUDA_FORCE_MMQ
        value: "1"
      - name: GGML_CUDA_FORCE_CUBLAS
        value: "1"

    secret:
      - name: HUGGING_FACE_HUB_TOKEN
        value: "" # token

jinjaTemplatePath: "files/template.jinja"
